                      if (pkg.contains("youtube")) return "YouTube";
                      if (pkg.contains("deezer")) return "Deezer";
                      return "";
                  }
              }

              private void sendMusic() {
                  String now = "{\"playing\":false}";
                  try {
                      for (MediaController c : watched) {
                          PlaybackState st = c.getPlaybackState();
                          MediaMetadata md = c.getMetadata();
                          if (st != null && st.getState() == PlaybackState.STATE_PLAYING && md != null) {
                              String title = md.getString(MediaMetadata.METADATA_KEY_TITLE);
                              if (title == null || title.isEmpty()) continue;
                              JSONObject o = new JSONObject();
                              o.put("playing", true);
                              o.put("title", title);
                              String artist = md.getString(MediaMetadata.METADATA_KEY_ARTIST);
                              o.put("artist", artist == null ? "" : artist);
                              o.put("app", appName(c.getPackageName()));
                              now = o.toString();
                              break;
                          }
                      }
                  } catch (Exception e) { /* keep "not playing" */ }
                  if (now.equals(lastMusic)) return;
                  lastMusic = now;
                  if (web != null) web.evaluateJavascript("window.pusheenMusic && pusheenMusic(" + now + ")", null);
              }

