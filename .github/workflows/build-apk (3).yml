              // ---------- music: which song is playing on the phone ----------
              private boolean musicAllowed() {
                  String flat = Settings.Secure.getString(getContentResolver(), "enabled_notification_listeners");
                  return flat != null && flat.contains(getPackageName());
              }

              private final MediaController.Callback songChanged = new MediaController.Callback() {
                  @Override public void onMetadataChanged(MediaMetadata m) { sendMusic(); }
                  @Override public void onPlaybackStateChanged(PlaybackState st) { sendMusic(); }
                  @Override public void onSessionDestroyed() { watchSessions(); }
              };

              private void startMusic() {
                  if (!musicAllowed()) return;
                  try {
                      if (sessions == null) {
                          sessions = (MediaSessionManager) getSystemService(MEDIA_SESSION_SERVICE);
                          listener = new ComponentName(this, MusicListener.class);
                          sessions.addOnActiveSessionsChangedListener(list -> watchSessions(), listener);
                      }
                      watchSessions();
                  } catch (Exception e) { /* access was turned off */ }
              }

              private void watchSessions() {
                  try {
                      for (MediaController c : watched) c.unregisterCallback(songChanged);
                      watched.clear();
                      for (MediaController c : sessions.getActiveSessions(listener)) {
                          c.registerCallback(songChanged, new Handler(Looper.getMainLooper()));
                          watched.add(c);
                      }
                  } catch (Exception e) { /* ignore */ }
                  sendMusic();
              }

              private String appName(String pkg) {
                  try {
