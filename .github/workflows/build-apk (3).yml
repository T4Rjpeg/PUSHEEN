              }

              static boolean available(Context c) {
                  SensorManager sm = c.getSystemService(SensorManager.class);
                  return sm != null && sm.getDefaultSensor(Sensor.TYPE_STEP_COUNTER) != null;
              }

              // while the app is open
              static void start(Context c) {
                  try {
                      if (live != null) return;
                      SensorManager sm = c.getSystemService(SensorManager.class);
                      Sensor s = sm.getDefaultSensor(Sensor.TYPE_STEP_COUNTER);
                      if (s == null) return;
                      live = new Steps(); live.ctx = c.getApplicationContext();
                      sm.registerListener(live, s, SensorManager.SENSOR_DELAY_NORMAL);
                      scheduleMidnight(c);
                  } catch (SecurityException e) { live = null; }
              }
              static void stop(Context c) {
                  try { if (live != null) c.getSystemService(SensorManager.class).unregisterListener(live); } catch (Exception e) { /* already off */ }
                  live = null;
              }

