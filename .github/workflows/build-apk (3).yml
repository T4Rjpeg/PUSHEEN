name: Build Pusheen APK

# Run it from the Actions tab: "Build Pusheen APK" -> "Run workflow"
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Create Android project
        run: |
          P=android
          mkdir -p $P/app/src/main/java/com/pusheen/app
          mkdir -p $P/app/src/main/assets
          mkdir -p $P/app/src/main/res/values $P/app/src/main/res/values-v27
          mkdir -p $P/app/src/main/res/layout $P/app/src/main/res/drawable
          mkdir -p $P/app/src/main/res/drawable-nodpi $P/app/src/main/res/mipmap-anydpi-v26 $P/app/src/main/res/mipmap-xxxhdpi $P/app/src/main/res/xml $P/app/src/main/res/raw

          # Your files from the repo: offline backup copy of the app, and icons
          cp index.html sprites.js extras.js scene.js core.js lang.js study.js brain.js mind.js games.js duo.js ui.js boot.js $P/app/src/main/assets/
          cp app-icon.png $P/app/src/main/res/drawable-nodpi/pusheen_fg.png
          cp icon-512.png $P/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
          # Her voice, taken out of sprites.js, for the alarm
          python3 -c "import re,base64; s=open('sprites.js').read(); m=re.search(r'var VOICE_WAV = \"data:audio/wav;base64,([^\"]+)\"', s); open('$P/app/src/main/res/raw/pusheen_voice.wav','wb').write(base64.b64decode(m.group(1)))"
          # Her face, for the little head that peeks over other apps
          python3 -c "import re,base64; s=open('sprites.js').read(); m=re.search(r'\"face_main\": \"data:image/png;base64,([^\"]+)\"', s); open('$P/app/src/main/res/drawable-nodpi/pusheen_head.png','wb').write(base64.b64decode(m.group(1)))"

          cat > $P/settings.gradle.kts <<'EOF'
          pluginManagement {
              repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
              repositories { google(); mavenCentral() }
          }
          rootProject.name = "Pusheen"
          include(":app")
          EOF

          cat > $P/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application") version "8.5.2" apply false
          }
          EOF

          cat > $P/gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2g
          android.useAndroidX=true
          EOF

          cat > $P/app/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application")
          }
          android {
              namespace = "com.pusheen.app"
              compileSdk = 34
              defaultConfig {
                  applicationId = "com.t4rjpeg.pusheen"
                  minSdk = 26
                  targetSdk = 34
                  versionCode = 8
                  versionName = "1.7"
              }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
          }
          dependencies {
              implementation("androidx.core:core:1.13.1")
          }
          EOF

          cat > $P/app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />
              <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />
              <uses-permission android:name="android.permission.VIBRATE" />
              <uses-permission android:name="android.permission.SCHEDULE_EXACT_ALARM" android:maxSdkVersion="32" />
              <uses-permission android:name="android.permission.USE_EXACT_ALARM" />
              <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_MEDIA_PLAYBACK" />
              <uses-permission android:name="android.permission.USE_FULL_SCREEN_INTENT" />
              <uses-permission android:name="android.permission.PACKAGE_USAGE_STATS" />
              <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />
              <uses-permission android:name="android.permission.ACCESS_BACKGROUND_LOCATION" />
              <uses-permission android:name="android.permission.ACTIVITY_RECOGNITION" />
              <uses-permission android:name="android.permission.READ_CALENDAR" />
              <uses-permission android:name="android.permission.RECORD_AUDIO" />
              <uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_SPECIAL_USE" />
              <queries>
                  <intent>
                      <action android:name="android.intent.action.MAIN" />
                      <category android:name="android.intent.category.LAUNCHER" />
                  </intent>
                  <intent>
                      <action android:name="android.speech.RecognitionService" />
                  </intent>
              </queries>
              <application
                  android:label="Pusheen"
                  android:icon="@mipmap/ic_launcher"
                  android:theme="@style/PusheenTheme">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:launchMode="singleTask"
                      android:screenOrientation="portrait"
                      android:windowSoftInputMode="adjustResize"
                      android:configChanges="orientation|screenSize|uiMode|keyboardHidden">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
                  <!-- Her alarm, her reminders, and putting the alarm back after a restart -->
                  <receiver android:name=".AlarmReceiver" android:exported="false" />
                  <receiver android:name=".NoticeReceiver" android:exported="false" />
                  <receiver android:name=".BootReceiver" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.BOOT_COMPLETED" />
                      </intent-filter>
                  </receiver>
                  <service android:name=".AlarmService" android:exported="false" android:foregroundServiceType="mediaPlayback" />
                  <!-- Places you named (home…), steps counted from midnight, and her home-screen widget -->
                  <receiver android:name=".Places" android:exported="false" />
                  <receiver android:name=".Steps" android:exported="false" />
                  <receiver android:name=".Widget" android:exported="true" android:label="Pusheen">
                      <intent-filter>
                          <action android:name="android.appwidget.action.APPWIDGET_UPDATE" />
                      </intent-filter>
                      <meta-data android:name="android.appwidget.provider" android:resource="@xml/pusheen_widget_info" />
                  </receiver>
                  <!-- Her little head peeking over other apps when you've scrolled one for too long -->
                  <receiver android:name=".OverlayCheck" android:exported="false" />
                  <service android:name=".OverlayService" android:exported="false" android:foregroundServiceType="specialUse">
                      <property android:name="android.app.PROPERTY_SPECIAL_USE_FGS_SUBTYPE" android:value="Shows Pusheen for a few seconds over the app you have been scrolling for too long" />
                  </service>
                  <!-- Photos you take for her are kept in the app's private cache -->
                  <provider
                      android:name="androidx.core.content.FileProvider"
                      android:authorities="com.t4rjpeg.pusheen.files"
                      android:exported="false"
                      android:grantUriPermissions="true">
                      <meta-data
                          android:name="android.support.FILE_PROVIDER_PATHS"
                          android:resource="@xml/file_paths" />
                  </provider>
                  <!-- Lets Pusheen see which song is playing (Android calls this "notification access") -->
                  <service
                      android:name=".MusicListener"
                      android:label="Pusheen (hears your music)"
                      android:exported="true"
                      android:permission="android.permission.BIND_NOTIFICATION_LISTENER_SERVICE">
                      <intent-filter>
                          <action android:name="android.service.notification.NotificationListenerService" />
                      </intent-filter>
                  </service>
              </application>
          </manifest>
          EOF

          cat > $P/app/src/main/java/com/pusheen/app/MainActivity.java <<'EOF'
          package com.pusheen.app;

          import android.Manifest;
          import android.app.Activity;
          import android.app.AppOpsManager;
          import android.app.usage.UsageEvents;
          import android.app.usage.UsageStatsManager;
          import android.app.Notification;
          import android.app.NotificationChannel;
          import android.app.NotificationManager;
          import android.app.PendingIntent;
          import android.content.ComponentName;
          import android.content.Intent;
          import android.content.pm.PackageManager;
          import android.graphics.Color;
          import android.net.Uri;
          import android.media.MediaMetadata;
          import android.media.session.MediaController;
          import android.media.session.MediaSessionManager;
          import android.media.session.PlaybackState;
          import android.os.Build;
          import android.os.Bundle;
          import android.os.Handler;
          import android.os.Looper;
          import android.provider.MediaStore;
          import android.provider.Settings;
          import android.speech.RecognitionListener;
          import android.speech.RecognizerIntent;
          import android.speech.SpeechRecognizer;
          import android.view.View;
          import android.webkit.GeolocationPermissions;
          import android.webkit.JavascriptInterface;
          import android.webkit.ValueCallback;
          import android.webkit.WebChromeClient;
          import android.webkit.WebResourceError;
          import android.webkit.WebResourceRequest;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import androidx.core.content.FileProvider;
          import org.json.JSONObject;
          import java.io.File;
          import java.util.ArrayList;
          import java.util.Calendar;
          import java.util.HashMap;
          import java.util.List;
          import java.util.Map;
          import org.json.JSONArray;

          public class MainActivity extends Activity {
              private WebView web;
              private static final String SITE = "https://t4rjpeg.github.io/PUSHEEN/";
              private static final String BACKUP = "file:///android_asset/index.html";
              private MediaSessionManager sessions;
              private ComponentName listener;
              private final List<MediaController> watched = new ArrayList<>();
              private volatile String lastMusic = "{\"playing\":false}";
              private volatile boolean resumed = false;
              static volatile boolean visible = false;
              private ValueCallback<Uri[]> fileCallback;
              private Uri cameraUri;
              private GeolocationPermissions.Callback geoCallback;
              private String geoOrigin;
              private SpeechRecognizer ears;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  web = new WebView(this);
                  web.setBackgroundColor(Color.rgb(196, 229, 245));
                  WebSettings s = web.getSettings();
                  s.setJavaScriptEnabled(true);
                  s.setDomStorageEnabled(true);
                  s.setCacheMode(WebSettings.LOAD_DEFAULT);
                  s.setMediaPlaybackRequiresUserGesture(false);   // her voice can play right away
                  s.setAllowFileAccess(true);
                  s.setGeolocationEnabled(true);
                  // Long presses do nothing (no text menu, no vibration)
                  web.setLongClickable(false);
                  web.setOnLongClickListener(v -> true);
                  web.setHapticFeedbackEnabled(false);
                  web.setVerticalScrollBarEnabled(false);
                  web.setHorizontalScrollBarEnabled(false);
                  web.setOverScrollMode(View.OVER_SCROLL_NEVER);
                  web.addJavascriptInterface(new Bridge(), "PusheenAndroid");
                  web.setWebChromeClient(new WebChromeClient() {
                      // "Take a picture" / "Send a photo" in the chat
                      @Override
                      public boolean onShowFileChooser(WebView view, ValueCallback<Uri[]> cb, FileChooserParams params) {
                          if (fileCallback != null) fileCallback.onReceiveValue(null);
                          fileCallback = cb;
                          // a save file to load (not a photo): any file, no camera
                          boolean onlyImages = true;
                          String[] acc = params.getAcceptTypes();
                          if (acc != null) for (String a : acc) if (a != null && a.trim().length() > 0 && !a.trim().startsWith("image")) onlyImages = false;
                          if (!onlyImages) {
                              cameraUri = null;
                              Intent any = new Intent(Intent.ACTION_GET_CONTENT);
                              any.addCategory(Intent.CATEGORY_OPENABLE);
                              any.setType("*/*");
                              try { startActivityForResult(Intent.createChooser(any, "Open a Pusheen save"), 42); }
                              catch (Exception e) { fileCallback.onReceiveValue(null); fileCallback = null; return false; }
                              return true;
                          }
                          Intent camera = null;
                          try {
                              File dir = new File(getCacheDir(), "photos");
                              dir.mkdirs();
                              File f = new File(dir, "photo-" + System.currentTimeMillis() + ".jpg");
                              cameraUri = FileProvider.getUriForFile(MainActivity.this, getPackageName() + ".files", f);
                              camera = new Intent(MediaStore.ACTION_IMAGE_CAPTURE);
                              camera.putExtra(MediaStore.EXTRA_OUTPUT, cameraUri);
                              camera.addFlags(Intent.FLAG_GRANT_WRITE_URI_PERMISSION | Intent.FLAG_GRANT_READ_URI_PERMISSION);
                          } catch (Exception e) { camera = null; cameraUri = null; }
                          Intent pick = new Intent(Intent.ACTION_GET_CONTENT);
                          pick.addCategory(Intent.CATEGORY_OPENABLE);
                          pick.setType("image/*");
                          Intent go;
                          if (params.isCaptureEnabled() && camera != null) go = camera;
                          else {
                              go = Intent.createChooser(pick, "Show her a photo");
                              if (camera != null) go.putExtra(Intent.EXTRA_INITIAL_INTENTS, new Intent[]{camera});
                          }
                          try { startActivityForResult(go, 42); }
                          catch (Exception e) { fileCallback.onReceiveValue(null); fileCallback = null; return false; }
                          return true;
                      }

                      // "Use my location" in Settings
                      @Override
                      public void onGeolocationPermissionsShowPrompt(String origin, GeolocationPermissions.Callback cb) {
                          if (checkSelfPermission(Manifest.permission.ACCESS_FINE_LOCATION) == PackageManager.PERMISSION_GRANTED) { cb.invoke(origin, true, false); return; }
                          geoOrigin = origin;
                          geoCallback = cb;
                          requestPermissions(new String[]{Manifest.permission.ACCESS_FINE_LOCATION, Manifest.permission.ACCESS_COARSE_LOCATION}, 9);
                      }
                  });
                  web.setWebViewClient(new WebViewClient() {
                      @Override
                      public void onReceivedError(WebView view, WebResourceRequest req, WebResourceError err) {
                          // No internet and nothing saved yet: show the copy built into the app
                          if (req.isForMainFrame() && !BACKUP.equals(view.getUrl())) {
                              view.loadUrl(BACKUP);
                          }
                      }
                  });
                  setContentView(web);
                  web.loadUrl(SITE);
                  wokeFromAlarm(getIntent());
              }

              @Override
              protected void onNewIntent(Intent intent) {
                  super.onNewIntent(intent);
                  wokeFromAlarm(intent);
              }

              // "I'm up" on her alarm: stop ringing
              private void wokeFromAlarm(Intent intent) {
                  if (intent != null && "up".equals(intent.getStringExtra("alarm"))) {
                      try { startService(new Intent(this, AlarmService.class).setAction("stop")); } catch (Exception e) { /* already quiet */ }
                  }
              }

              // ---------- what the page can ask the phone ----------
              private class Bridge {
                  // a save file into Downloads/Pusheen (no permission needed on Android 10+; older phones get the app's own folder)
                  @JavascriptInterface public String saveFile(String name, String text) {
                      try {
                          String safe = name.replaceAll("[^A-Za-z0-9._-]", "_");
                          byte[] bytes = text.getBytes("UTF-8");
                          if (Build.VERSION.SDK_INT >= 29) {
                              android.content.ContentValues cv = new android.content.ContentValues();
                              cv.put(MediaStore.MediaColumns.DISPLAY_NAME, safe);
                              cv.put(MediaStore.MediaColumns.MIME_TYPE, "text/plain");
                              cv.put(MediaStore.MediaColumns.RELATIVE_PATH, android.os.Environment.DIRECTORY_DOWNLOADS + "/Pusheen");
                              Uri uri = getContentResolver().insert(MediaStore.Downloads.EXTERNAL_CONTENT_URI, cv);
                              if (uri == null) return "";
                              java.io.OutputStream os = getContentResolver().openOutputStream(uri);
                              if (os == null) return "";
                              try { os.write(bytes); } finally { os.close(); }
                              return "Download/Pusheen/" + safe;
                          }
                          File dir = new File(getExternalFilesDir(android.os.Environment.DIRECTORY_DOWNLOADS), "Pusheen");
                          dir.mkdirs();
                          File f = new File(dir, safe);
                          java.io.FileOutputStream fos = new java.io.FileOutputStream(f);
                          try { fos.write(bytes); } finally { fos.close(); }
                          return f.getAbsolutePath();
                      } catch (Exception e) { return ""; }
                  }
                  @JavascriptInterface public boolean hasMusicAccess() { return musicAllowed(); }
                  @JavascriptInterface public void openMusicAccess() {
                      runOnUiThread(() -> startActivity(new Intent(Settings.ACTION_NOTIFICATION_LISTENER_SETTINGS)));
                  }
                  @JavascriptInterface public String nowPlaying() { return lastMusic; }
                  @JavascriptInterface public void askNotify() {
                      if (Build.VERSION.SDK_INT >= 33 && checkSelfPermission("android.permission.POST_NOTIFICATIONS") != PackageManager.PERMISSION_GRANTED) {
                          runOnUiThread(() -> requestPermissions(new String[]{"android.permission.POST_NOTIFICATIONS"}, 7));
                      }
                  }
                  @JavascriptInterface public void notify(String title, String text) { Notices.post(MainActivity.this, title, text); }
                  @JavascriptInterface public void notifyAt(int seconds, String title, String text) { Notices.at(MainActivity.this, System.currentTimeMillis() + seconds * 1000L, title, text); }
                  @JavascriptInterface public void setAlarm(int h, int m) { Alarms.setDaily(MainActivity.this, h, m); }
                  @JavascriptInterface public void cancelAlarm() { Alarms.cancel(MainActivity.this); }
                  @JavascriptInterface public void setAlarmLines(String json) { Alarms.prefs(MainActivity.this).edit().putString("lines", json).apply(); }
                  @JavascriptInterface public String alarmLog() {
                      android.content.SharedPreferences p = Alarms.prefs(MainActivity.this);
                      return "{\"fired\":" + p.getLong("fired", 0) + ",\"snoozes\":" + p.getInt("snoozes", 0) + ",\"stopped\":" + p.getLong("stopped", 0) + ",\"timedOut\":" + p.getBoolean("timedOut", false) + "}";
                  }
                  @JavascriptInterface public void alarmStop() {
                      android.content.SharedPreferences p = Alarms.prefs(MainActivity.this);
                      if (p.getLong("fired", 0) > p.getLong("stopped", 0)) {
                          p.edit().putLong("stopped", System.currentTimeMillis()).apply();
                          Alarms.rescheduleDaily(MainActivity.this);   // cancels a pending snooze
                          if (AlarmService.running) runOnUiThread(() -> startService(new Intent(MainActivity.this, AlarmService.class).setAction("stop")));
                      }
                  }
                  @JavascriptInterface public boolean hasUsageAccess() { return usageAllowed(); }
                  @JavascriptInterface public void openUsageAccess() { runOnUiThread(() -> startActivity(new Intent(Settings.ACTION_USAGE_ACCESS_SETTINGS))); }
                  @JavascriptInterface public String screenTime() { return todaysScreenTime(); }
                  @JavascriptInterface public boolean inBackground() { return !resumed; }
                  // her senses
                  @JavascriptInterface public String battery() { return Senses.battery(MainActivity.this); }
                  @JavascriptInterface public boolean headphones() { return Senses.headphones(MainActivity.this); }
                  @JavascriptInterface public boolean inCall() { return Senses.inCall(MainActivity.this); }
                  @JavascriptInterface public String calendar(int days) { return Senses.calendar(MainActivity.this, days); }
                  @JavascriptInterface public String sleepLast() { return usageAllowed() ? Senses.sleepLast(MainActivity.this) : "null"; }
                  @JavascriptInterface public String steps() { return hasPerm("activity") ? Steps.today(MainActivity.this) : "null"; }
                  @JavascriptInterface public String unread() { return musicAllowed() ? MusicListener.unread(MainActivity.this) : "null"; }
                  @JavascriptInterface public boolean hasPerm(String what) { return permOk(what); }
                  @JavascriptInterface public void askPerm(String what) { runOnUiThread(() -> askFor(what)); }
                  @JavascriptInterface public void openAppSettings() { runOnUiThread(() -> startActivity(new Intent(Settings.ACTION_APPLICATION_DETAILS_SETTINGS, Uri.parse("package:" + getPackageName())))); }
                  // places you named
                  @JavascriptInterface public void setPlaces(String json) { Places.set(MainActivity.this, json); }
                  @JavascriptInterface public String placeLog() { return Places.takeLog(MainActivity.this); }
                  @JavascriptInterface public void setPlaceLines(String json) { Alarms.prefs(MainActivity.this).edit().putString("placeLines", json).apply(); }
                  // texting you first, and the home-screen widget
                  @JavascriptInterface public void textAt(int slot, int seconds, String text) { Notices.atSlot(MainActivity.this, 9100 + slot, System.currentTimeMillis() + seconds * 1000L, "Pusheen", text); }
                  @JavascriptInterface public void cancelTexts() { for (int i = 0; i < 3; i++) Notices.cancelSlot(MainActivity.this, 9100 + i); }
                  @JavascriptInterface public void setWidget(String png, String text) { Widget.save(MainActivity.this, png, text); }
                  // talking to her out loud
                  @JavascriptInterface public void listen(String lang) { runOnUiThread(() -> startListening(lang)); }
                  @JavascriptInterface public void stopListen() { runOnUiThread(() -> { if (ears != null) ears.stopListening(); }); }
                  // which apps you used since a moment (studying together), and her head over other apps
                  @JavascriptInterface public String appsSince(double since) { return appsSinceJson((long) since); }
                  @JavascriptInterface public boolean canOverlay() { return Settings.canDrawOverlays(MainActivity.this); }
                  @JavascriptInterface public void openOverlay() { runOnUiThread(() -> startActivity(new Intent(Settings.ACTION_MANAGE_OVERLAY_PERMISSION, Uri.parse("package:" + getPackageName())))); }
                  @JavascriptInterface public void setOverlay(String json) { Overlay.configure(MainActivity.this, json); }
              }

              // ---------- permissions she can ask for ----------
              private String[] permsFor(String what) {
                  switch (what) {
                      case "location": return new String[]{Manifest.permission.ACCESS_FINE_LOCATION, Manifest.permission.ACCESS_COARSE_LOCATION};
                      case "bgLocation": return Build.VERSION.SDK_INT >= 29 ? new String[]{Manifest.permission.ACCESS_BACKGROUND_LOCATION} : new String[]{Manifest.permission.ACCESS_FINE_LOCATION};
                      case "activity": return Build.VERSION.SDK_INT >= 29 ? new String[]{Manifest.permission.ACTIVITY_RECOGNITION} : new String[0];
                      case "calendar": return new String[]{Manifest.permission.READ_CALENDAR};
                      case "mic": return new String[]{Manifest.permission.RECORD_AUDIO};
                      default: return new String[0];
                  }
              }
              private boolean permOk(String what) {
                  if ("steps".equals(what)) return Steps.available(this);
                  for (String p : permsFor(what)) if (checkSelfPermission(p) != PackageManager.PERMISSION_GRANTED) return false;
                  return true;
              }
              private void askFor(String what) {
                  String[] ps = permsFor(what);
                  if (ps.length == 0 || permOk(what)) { permChanged(); return; }
                  if ("bgLocation".equals(what) && checkSelfPermission(Manifest.permission.ACCESS_FINE_LOCATION) != PackageManager.PERMISSION_GRANTED) ps = permsFor("location");
                  if ("bgLocation".equals(what) && Build.VERSION.SDK_INT >= 30 && checkSelfPermission(Manifest.permission.ACCESS_FINE_LOCATION) == PackageManager.PERMISSION_GRANTED) {
                      // Android only lets you pick "Allow all the time" in the app's settings page
                      startActivity(new Intent(Settings.ACTION_APPLICATION_DETAILS_SETTINGS, Uri.parse("package:" + getPackageName())));
                      return;
                  }
                  requestPermissions(ps, 21);
              }
              private void permChanged() {
                  if (permOk("activity")) Steps.start(this);
                  if (permOk("location")) Places.apply(this);
                  if (web != null) web.evaluateJavascript("window.pusheenPerm && pusheenPerm()", null);
              }

              // ---------- listening: hold the mic button and talk ----------
              private void startListening(String lang) {
                  if (checkSelfPermission(Manifest.permission.RECORD_AUDIO) != PackageManager.PERMISSION_GRANTED) { requestPermissions(new String[]{Manifest.permission.RECORD_AUDIO}, 21); heard("", true, "permission"); return; }
                  if (!SpeechRecognizer.isRecognitionAvailable(this)) { heard("", true, "unavailable"); return; }
                  if (ears == null) {
                      ears = SpeechRecognizer.createSpeechRecognizer(this);
                      ears.setRecognitionListener(new RecognitionListener() {
                          @Override public void onReadyForSpeech(Bundle b) {}
                          @Override public void onBeginningOfSpeech() {}
                          @Override public void onRmsChanged(float v) {}
                          @Override public void onBufferReceived(byte[] b) {}
                          @Override public void onEndOfSpeech() {}
                          @Override public void onError(int code) { heard("", true, "error" + code); }
                          @Override public void onResults(Bundle b) { heard(first(b), true, null); }
                          @Override public void onPartialResults(Bundle b) { heard(first(b), false, null); }
                          @Override public void onEvent(int t, Bundle b) {}
                      });
                  }
                  Intent i = new Intent(RecognizerIntent.ACTION_RECOGNIZE_SPEECH);
                  i.putExtra(RecognizerIntent.EXTRA_LANGUAGE_MODEL, RecognizerIntent.LANGUAGE_MODEL_FREE_FORM);
                  if (lang != null && !lang.isEmpty()) i.putExtra(RecognizerIntent.EXTRA_LANGUAGE, lang);
                  i.putExtra(RecognizerIntent.EXTRA_PARTIAL_RESULTS, true);
                  try { ears.startListening(i); } catch (Exception e) { heard("", true, "error"); }
              }
              private String first(Bundle b) {
                  ArrayList<String> r = b == null ? null : b.getStringArrayList(SpeechRecognizer.RESULTS_RECOGNITION);
                  return r == null || r.isEmpty() ? "" : r.get(0);
              }
              private void heard(String text, boolean done, String err) {
                  if (web == null) return;
