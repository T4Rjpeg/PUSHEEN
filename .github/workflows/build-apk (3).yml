                  long now = System.currentTimeMillis();
                  Uri.Builder b = CalendarContract.Instances.CONTENT_URI.buildUpon();
                  ContentUris.appendId(b, now - 12L * 3600000L);
                  ContentUris.appendId(b, now + Math.max(1, Math.min(7, days)) * 86400000L);
                  String[] cols = { CalendarContract.Instances.EVENT_ID, CalendarContract.Instances.TITLE, CalendarContract.Instances.BEGIN, CalendarContract.Instances.END, CalendarContract.Instances.ALL_DAY };
                  try (Cursor q = c.getContentResolver().query(b.build(), cols, null, null, CalendarContract.Instances.BEGIN + " ASC")) {
