                      long now = System.currentTimeMillis();
                      UsageEvents ev = um.queryEvents(Math.max(0, since - 1000), now);
                      Map<String, Long> open = new HashMap<>(), total = new HashMap<>();
                      UsageEvents.Event e = new UsageEvents.Event();
                      String me = getPackageName();
                      while (ev.hasNextEvent()) {
                          ev.getNextEvent(e);
                          String pkg = e.getPackageName();
                          if (pkg == null || pkg.equals(me) || pkg.startsWith("com.android.systemui")) continue;
                          long ts = Math.max(since, e.getTimeStamp());
                          if (e.getEventType() == UsageEvents.Event.MOVE_TO_FOREGROUND) open.put(pkg, ts);
                          else if (e.getEventType() == UsageEvents.Event.MOVE_TO_BACKGROUND) { Long s0 = open.remove(pkg); if (s0 != null) total.merge(pkg, ts - s0, Long::sum); }
                      }
                      for (Map.Entry<String, Long> o : open.entrySet()) total.merge(o.getKey(), now - o.getValue(), Long::sum);
                      JSONArray out = new JSONArray();
                      for (Map.Entry<String, Long> x : total.entrySet()) {
                          if (x.getValue() < 3000) continue;
                          JSONObject o = new JSONObject();
                          String nm = appName(x.getKey());
                          o.put("pkg", x.getKey()); o.put("label", nm.isEmpty() ? x.getKey() : nm); o.put("ms", x.getValue()); o.put("cat", Overlay.category(this, x.getKey()));
