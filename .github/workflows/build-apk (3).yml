              static void scheduleMidnight(Context c) {
                  Calendar t = Calendar.getInstance(); t.add(Calendar.DAY_OF_YEAR, 1); t.set(Calendar.HOUR_OF_DAY, 0); t.set(Calendar.MINUTE, 3); t.set(Calendar.SECOND, 0);
