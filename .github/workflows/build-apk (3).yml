          package com.pusheen.app;

          import android.app.AlarmManager;
          import android.app.PendingIntent;
          import android.content.Context;
          import android.content.Intent;
          import android.content.SharedPreferences;
          import java.util.Calendar;

          // Her wake-up alarm: every day at the time you chose
          public class Alarms {
              static SharedPreferences prefs(Context c) { return c.getSharedPreferences("pusheen", Context.MODE_PRIVATE); }

              static PendingIntent ring(Context c) {
                  Intent i = new Intent(c, AlarmReceiver.class);
                  i.setAction("com.pusheen.app.RING");
                  return PendingIntent.getBroadcast(c, 1, i, PendingIntent.FLAG_IMMUTABLE | PendingIntent.FLAG_UPDATE_CURRENT);
              }

              static void scheduleAt(Context c, long when) {
                  AlarmManager am = c.getSystemService(AlarmManager.class);
                  PendingIntent show = PendingIntent.getActivity(c, 2, new Intent(c, MainActivity.class), PendingIntent.FLAG_IMMUTABLE | PendingIntent.FLAG_UPDATE_CURRENT);
                  try { am.setAlarmClock(new AlarmManager.AlarmClockInfo(when, show), ring(c)); }
                  catch (SecurityException e) { am.setAndAllowWhileIdle(AlarmManager.RTC_WAKEUP, when, ring(c)); }
              }

              static long next(int h, int m) {
                  Calendar cal = Calendar.getInstance();
                  cal.set(Calendar.HOUR_OF_DAY, h); cal.set(Calendar.MINUTE, m); cal.set(Calendar.SECOND, 0); cal.set(Calendar.MILLISECOND, 0);
                  if (cal.getTimeInMillis() <= System.currentTimeMillis() + 5000) cal.add(Calendar.DAY_OF_YEAR, 1);
                  return cal.getTimeInMillis();
              }

              static void setDaily(Context c, int h, int m) {
                  prefs(c).edit().putInt("h", h).putInt("m", m).putBoolean("on", true).apply();
                  scheduleAt(c, next(h, m));
              }

              static void cancel(Context c) {
                  prefs(c).edit().putBoolean("on", false).apply();
                  c.getSystemService(AlarmManager.class).cancel(ring(c));
              }

              static void rescheduleDaily(Context c) {
                  SharedPreferences p = prefs(c);
                  if (p.getBoolean("on", false)) scheduleAt(c, next(p.getInt("h", 7), p.getInt("m", 0)));
              }
          }
