                          JSONObject o = new JSONObject();
                          o.put("id", q.getLong(0) + "-" + q.getLong(2));
                          o.put("title", q.getString(1) == null ? "" : q.getString(1));
                          o.put("start", q.getLong(2));
                          o.put("end", q.getLong(3));
                          o.put("allDay", q.getInt(4) == 1);
                          out.put(o);
                      }
                  } catch (Exception e) { return "null"; }
