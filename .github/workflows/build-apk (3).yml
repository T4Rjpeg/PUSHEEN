          package com.pusheen.app;

          import android.app.Notification;
          import android.app.NotificationChannel;
          import android.app.NotificationManager;
          import android.app.PendingIntent;
          import android.app.Service;
          import android.content.Intent;
          import android.content.SharedPreferences;
          import android.content.pm.ServiceInfo;
          import android.graphics.drawable.Icon;
          import android.media.AudioAttributes;
          import android.media.SoundPool;
          import android.os.Build;
          import android.os.Handler;
          import android.os.IBinder;
          import android.os.Looper;
          import android.os.VibrationEffect;
          import android.os.Vibrator;
          import org.json.JSONArray;

          // Rings with her voice (little bursts, like she's talking) and buzzes until you get up or snooze
          public class AlarmService extends Service {
              static volatile boolean running = false;
              private SoundPool pool;
              private int sound, stream;
              private boolean ringing;
              private Vibrator vib;
              private final Handler h = new Handler(Looper.getMainLooper());
              private static final long[] TALK = {520, 180, 300, 160, 700, 900, 380, 140, 450, 1100};

              @Override public IBinder onBind(Intent i) { return null; }

              @Override
              public int onStartCommand(Intent intent, int flags, int startId) {
                  String a = intent == null || intent.getAction() == null ? "ring" : intent.getAction();
                  SharedPreferences p = Alarms.prefs(this);
                  if ("stop".equals(a)) {
                      p.edit().putLong("stopped", System.currentTimeMillis()).apply();
                      quiet(); stopSelf();
                      return START_NOT_STICKY;
                  }
                  if ("snooze".equals(a)) {
                      p.edit().putInt("snoozes", p.getInt("snoozes", 0) + 1).apply();
                      quiet();
                      Alarms.scheduleAt(this, System.currentTimeMillis() + 9 * 60000L);
                      stopSelf();
                      return START_NOT_STICKY;
                  }
                  long now = System.currentTimeMillis();
                  boolean snoozeRing = p.getLong("fired", 0) > now - 3 * 3600000L && p.getLong("stopped", 0) < p.getLong("fired", 0);
                  if (!snoozeRing) p.edit().putLong("fired", now).putInt("snoozes", 0).putLong("stopped", 0).putBoolean("timedOut", false).apply();
                  Notification n = notice(p);
                  if (Build.VERSION.SDK_INT >= 29) startForeground(77, n, ServiceInfo.FOREGROUND_SERVICE_TYPE_MEDIA_PLAYBACK);
                  else startForeground(77, n);
                  running = true;
                  if (!snoozeRing) Alarms.rescheduleDaily(this);   // tomorrow, same time
                  ring();
                  return START_NOT_STICKY;
              }

              private Notification notice(SharedPreferences p) {
                  NotificationChannel ch = new NotificationChannel("pusheen_alarm", "Pusheen alarm", NotificationManager.IMPORTANCE_HIGH);
                  ch.setSound(null, null);
                  ch.enableVibration(false);
                  getSystemService(NotificationManager.class).createNotificationChannel(ch);
                  String line = "Wake up.", up = "I'm up", snooze = "Snooze 9 min";
                  try {
                      org.json.JSONObject o = new org.json.JSONObject(p.getString("lines", "{}"));
                      JSONArray lines = o.optJSONArray("lines");
                      if (lines != null && lines.length() > 0) line = lines.getString((int) (Math.random() * lines.length()));
                      up = o.optString("up", up);
                      snooze = o.optString("snooze", snooze);
                  } catch (Exception e) { /* keep the defaults */ }
                  Intent open = new Intent(this, MainActivity.class);
                  open.putExtra("alarm", "up");
                  open.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                  PendingIntent openPi = PendingIntent.getActivity(this, 3, open, PendingIntent.FLAG_IMMUTABLE | PendingIntent.FLAG_UPDATE_CURRENT);
                  PendingIntent snoozePi = PendingIntent.getService(this, 5, new Intent(this, AlarmService.class).setAction("snooze"), PendingIntent.FLAG_IMMUTABLE | PendingIntent.FLAG_UPDATE_CURRENT);
                  return new Notification.Builder(this, "pusheen_alarm")
                      .setSmallIcon(android.R.drawable.ic_lock_idle_alarm)
                      .setContentTitle("Pusheen")
                      .setContentText(line)
                      .setCategory(Notification.CATEGORY_ALARM)
                      .setOngoing(true)
                      .setFullScreenIntent(openPi, true)
                      .setContentIntent(openPi)
                      .addAction(new Notification.Action.Builder((Icon) null, up, openPi).build())
                      .addAction(new Notification.Action.Builder((Icon) null, snooze, snoozePi).build())
                      .build();
              }

              private void ring() {
                  ringing = true;
                  AudioAttributes aa = new AudioAttributes.Builder().setUsage(AudioAttributes.USAGE_ALARM).setContentType(AudioAttributes.CONTENT_TYPE_SONIFICATION).build();
                  pool = new SoundPool.Builder().setMaxStreams(1).setAudioAttributes(aa).build();
                  pool.setOnLoadCompleteListener((sp, id, status) -> talk(0));
                  sound = pool.load(this, R.raw.pusheen_voice, 1);
                  vib = (Vibrator) getSystemService(VIBRATOR_SERVICE);
                  try { vib.vibrate(VibrationEffect.createWaveform(new long[]{0, 400, 300, 400, 1200}, 0), aa); } catch (Exception e) { /* no vibrator */ }
                  h.postDelayed(() -> {
                      if (!ringing) return;
                      Alarms.prefs(this).edit().putBoolean("timedOut", true).apply();
                      quiet(); stopSelf();
                  }, 10 * 60000L);
              }

              private void talk(int step) {
                  if (!ringing || pool == null) return;
                  if (step % 2 == 0) stream = pool.play(sound, 1f, 1f, 1, -1, 2.0f);
                  else if (stream != 0) { pool.stop(stream); stream = 0; }
                  h.postDelayed(() -> talk(step + 1), TALK[step % TALK.length]);
              }

              private void quiet() {
                  ringing = false; running = false;
                  h.removeCallbacksAndMessages(null);
                  try { if (pool != null) pool.release(); } catch (Exception e) { /* ignore */ }
                  pool = null;
                  try { if (vib != null) vib.cancel(); } catch (Exception e) { /* ignore */ }
                  stopForeground(STOP_FOREGROUND_REMOVE);
              }

              @Override
              public void onDestroy() { if (ringing) quiet(); super.onDestroy(); }
          }
