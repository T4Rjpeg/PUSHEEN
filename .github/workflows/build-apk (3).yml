                  } catch (Exception ex) { return "[]"; }
              }

              private String todaysScreenTime() {
                  try {
                      if (!usageAllowed()) return "{}";
                      UsageStatsManager um = (UsageStatsManager) getSystemService(USAGE_STATS_SERVICE);
                      Calendar c = Calendar.getInstance();
                      c.set(Calendar.HOUR_OF_DAY, 0); c.set(Calendar.MINUTE, 0); c.set(Calendar.SECOND, 0); c.set(Calendar.MILLISECOND, 0);
                      long now = System.currentTimeMillis();
                      UsageEvents ev = um.queryEvents(c.getTimeInMillis(), now);
                      Map<String, Long> since = new HashMap<>(), total = new HashMap<>();
                      UsageEvents.Event e = new UsageEvents.Event();
                      String home = "";
                      try {
                          Intent hi = new Intent(Intent.ACTION_MAIN); hi.addCategory(Intent.CATEGORY_HOME);
                          android.content.pm.ResolveInfo ri = getPackageManager().resolveActivity(hi, 0);
                          if (ri != null && ri.activityInfo != null) home = ri.activityInfo.packageName;
                      } catch (Exception x) { /* no launcher found */ }
                      while (ev.hasNextEvent()) {
                          ev.getNextEvent(e);
                          String pkg = e.getPackageName();
                          if (pkg == null || pkg.equals(home) || pkg.startsWith("com.android.systemui")) continue;
                          if (e.getEventType() == UsageEvents.Event.MOVE_TO_FOREGROUND) since.put(pkg, e.getTimeStamp());
                          else if (e.getEventType() == UsageEvents.Event.MOVE_TO_BACKGROUND) {
                              Long s0 = since.remove(pkg);
                              if (s0 != null) total.put(pkg, (total.containsKey(pkg) ? total.get(pkg) : 0L) + (e.getTimeStamp() - s0));
                          }
                      }
                      for (Map.Entry<String, Long> open : since.entrySet()) total.put(open.getKey(), (total.containsKey(open.getKey()) ? total.get(open.getKey()) : 0L) + (now - open.getValue()));
                      List<Map.Entry<String, Long>> list = new ArrayList<>(total.entrySet());
                      list.sort((a, b) -> Long.compare(b.getValue(), a.getValue()));
                      long sum = 0;
                      for (Map.Entry<String, Long> x : list) sum += x.getValue();
                      JSONArray top = new JSONArray();
                      for (int i = 0; i < Math.min(5, list.size()); i++) {
                          JSONObject o = new JSONObject();
                          String name = appName(list.get(i).getKey());
                          o.put("app", name.isEmpty() ? list.get(i).getKey() : name);
                          o.put("min", Math.round(list.get(i).getValue() / 60000.0));
                          top.put(o);
                      }
                      JSONObject out = new JSONObject();
                      out.put("total", Math.round(sum / 60000.0));
                      out.put("top", top);
                      return out.toString();
                  } catch (Exception e) { return "{}"; }
              }

