                      List<long[]> merged = new ArrayList<>();
                      for (long[] o : offs) {
                          if (!merged.isEmpty() && o[0] - merged.get(merged.size() - 1)[1] < 4 * 60000L) merged.get(merged.size() - 1)[1] = o[1];
                          else merged.add(new long[]{o[0], o[1]});
                      }
                      long[] best = null;
                      for (long[] o : merged) {
                          long len = o[1] - o[0];
                          if (len < 150 * 60000L) continue;
                          Calendar mid = Calendar.getInstance(); mid.setTimeInMillis(o[0] + len / 2);
                          int h = mid.get(Calendar.HOUR_OF_DAY);
                          if (!(h >= 22 || h <= 10)) continue;
                          if (best == null || o[1] > best[1]) best = o;   // the most recent night
                      }
                      if (best == null) return "null";
                      return "{\"slept\":" + best[0] + ",\"woke\":" + best[1] + "}";
                  } catch (Exception x) { return "null"; }
              }
          }
