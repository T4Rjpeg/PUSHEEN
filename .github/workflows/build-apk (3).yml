          package com.pusheen.app;

          import android.Manifest;
          import android.app.PendingIntent;
          import android.content.BroadcastReceiver;
          import android.content.Context;
          import android.content.Intent;
          import android.content.SharedPreferences;
          import android.content.pm.PackageManager;
          import android.location.LocationManager;
          import java.util.Calendar;
          import org.json.JSONArray;
          import org.json.JSONObject;

          // The places you named (home, school…): the phone tells her when you arrive or leave, even with the app closed
          public class Places extends BroadcastReceiver {
              static PendingIntent intent(Context c, int n, String id, String kind) {
                  Intent i = new Intent(c, Places.class).putExtra("id", id).putExtra("kind", kind);
                  return PendingIntent.getBroadcast(c, 5100 + n, i, PendingIntent.FLAG_MUTABLE | PendingIntent.FLAG_UPDATE_CURRENT);
              }

              static void set(Context c, String json) {
                  SharedPreferences p = Alarms.prefs(c);
                  p.edit().putString("places", json).apply();
                  apply(c);
              }

              static void apply(Context c) {
                  SharedPreferences p = Alarms.prefs(c);
                  LocationManager lm = c.getSystemService(LocationManager.class);
                  int old = p.getInt("placeCount", 0);
                  for (int n = 0; n < old; n++) { try { lm.removeProximityAlert(intent(c, n, "", "")); } catch (Exception e) { /* gone */ } }
                  if (c.checkSelfPermission(Manifest.permission.ACCESS_FINE_LOCATION) != PackageManager.PERMISSION_GRANTED) { p.edit().putInt("placeCount", 0).apply(); return; }
                  int count = 0;
                  try {
                      JSONArray a = new JSONArray(p.getString("places", "[]"));
                      for (int n = 0; n < Math.min(12, a.length()); n++) {
                          JSONObject o = a.getJSONObject(n);
                          lm.addProximityAlert(o.getDouble("lat"), o.getDouble("lon"), (float) o.optDouble("r", 150), -1, intent(c, n, o.getString("id"), o.optString("kind", "other")));
                          count++;
                      }
                  } catch (Exception e) { /* bad list or no permission */ }
                  p.edit().putInt("placeCount", count).apply();
              }

              @Override public void onReceive(Context c, Intent i) {
                  boolean in = i.getBooleanExtra(LocationManager.KEY_PROXIMITY_ENTERING, false);
                  String id = i.getStringExtra("id"), kind = i.getStringExtra("kind");
                  if (id == null) return;
                  SharedPreferences p = Alarms.prefs(c);
                  long now = System.currentTimeMillis();
                  try {
                      JSONArray log = new JSONArray(p.getString("placeLog", "[]"));
                      JSONObject e = new JSONObject(); e.put("id", id); e.put("kind", in ? "enter" : "exit"); e.put("at", now);
                      log.put(e);
                      while (log.length() > 40) log.remove(0);
                      SharedPreferences.Editor ed = p.edit().putString("placeLog", log.toString());
                      if ("home".equals(kind) && !in) ed.putLong("leftHome", now);
                      ed.apply();
                  } catch (Exception x) { /* keep going */ }
                  // coming home after a while: she says so
                  if (in && "home".equals(kind) && !MainActivity.visible && now - p.getLong("leftHome", now) > 3L * 3600000L && now - p.getLong("welcomed", 0) > 12L * 3600000L) {
                      int h = Calendar.getInstance().get(Calendar.HOUR_OF_DAY);
                      if (h >= 7 && h < 23) {
                          String line = "Welcome home.";
                          try { JSONArray ls = new JSONObject(p.getString("placeLines", "{}")).getJSONArray("home"); if (ls.length() > 0) line = ls.getString((int) (Math.random() * ls.length())); } catch (Exception x) { /* default */ }
                          p.edit().putLong("welcomed", now).apply();
                          Notices.post(c, "Pusheen", line);
                          Widget.say(c, line);
                      }
                  }
              }

              static String takeLog(Context c) {
                  SharedPreferences p = Alarms.prefs(c);
                  String s = p.getString("placeLog", "[]");
                  p.edit().putString("placeLog", "[]").apply();
                  return s;
              }
          }
          EOF

          cat > $P/app/src/main/java/com/pusheen/app/Widget.java <<'EOF'
          package com.pusheen.app;

          import android.app.PendingIntent;
          import android.appwidget.AppWidgetManager;
          import android.appwidget.AppWidgetProvider;
          import android.content.ComponentName;
          import android.content.Context;
          import android.content.Intent;
          import android.graphics.Bitmap;
          import android.graphics.BitmapFactory;
          import android.util.Base64;
          import android.widget.RemoteViews;
          import java.io.File;
          import java.io.FileOutputStream;

          // Pusheen on your home screen: her face and the last thing she said
          public class Widget extends AppWidgetProvider {
              @Override public void onUpdate(Context c, AppWidgetManager m, int[] ids) { refresh(c); }

              static void save(Context c, String pngB64, String text) {
                  try {
                      if (pngB64 != null && !pngB64.isEmpty()) {
                          byte[] b = Base64.decode(pngB64.replaceFirst("^data:image/png;base64,", ""), Base64.DEFAULT);
                          try (FileOutputStream o = new FileOutputStream(new File(c.getFilesDir(), "widget.png"))) { o.write(b); }
                      }
                      if (text != null) Alarms.prefs(c).edit().putString("widgetText", text).apply();
                  } catch (Exception e) { /* keep the old picture */ }
                  refresh(c);
              }
              static void say(Context c, String text) { save(c, null, text); }

              static void refresh(Context c) {
                  try {
                      AppWidgetManager m = AppWidgetManager.getInstance(c);
                      int[] ids = m.getAppWidgetIds(new ComponentName(c, Widget.class));
                      if (ids == null || ids.length == 0) return;
                      RemoteViews v = new RemoteViews(c.getPackageName(), R.layout.pusheen_widget);
                      File f = new File(c.getFilesDir(), "widget.png");
                      if (f.exists()) { Bitmap bm = BitmapFactory.decodeFile(f.getPath()); if (bm != null) v.setImageViewBitmap(R.id.face, bm); }
                      v.setTextViewText(R.id.line, Alarms.prefs(c).getString("widgetText", "…"));
                      PendingIntent pi = PendingIntent.getActivity(c, 3, new Intent(c, MainActivity.class), PendingIntent.FLAG_IMMUTABLE | PendingIntent.FLAG_UPDATE_CURRENT);
                      v.setOnClickPendingIntent(R.id.root, pi);
                      m.updateAppWidget(ids, v);
                  } catch (Exception e) { /* no widget */ }
              }
          }
          EOF

