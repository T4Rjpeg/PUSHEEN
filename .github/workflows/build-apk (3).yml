              private Context ctx;
              private PendingResult pending;

              static String day() { return new SimpleDateFormat("yyyy-MM-dd", Locale.US).format(new Date()); }

              static void record(Context c, float v) {
                  SharedPreferences p = Alarms.prefs(c);
                  float last = p.getFloat("stepLast", -1f), carry = p.getFloat("stepCarry", 0f);
                  if (last >= 0 && v < last) carry += last;      // the phone restarted and the counter went back to 0
                  float total = v + carry;
                  SharedPreferences.Editor ed = p.edit().putFloat("stepLast", v).putFloat("stepCarry", carry).putFloat("stepTotal", total).putLong("stepAt", System.currentTimeMillis());
                  if (!day().equals(p.getString("stepDay", ""))) ed.putString("stepDay", day()).putFloat("stepBase", total);
                  ed.apply();
              }

              static String today(Context c) {
                  SharedPreferences p = Alarms.prefs(c);
                  if (!day().equals(p.getString("stepDay", ""))) return "{\"today\":0,\"at\":0}";
