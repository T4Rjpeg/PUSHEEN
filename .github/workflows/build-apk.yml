name: Build Pusheen APK

# Run it from the Actions tab: "Build Pusheen APK" -> "Run workflow"
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Create Android project
        run: |
          P=android
          mkdir -p $P/app/src/main/java/com/pusheen/app
          mkdir -p $P/app/src/main/assets
          mkdir -p $P/app/src/main/res/values $P/app/src/main/res/values-v27
          mkdir -p $P/app/src/main/res/drawable-nodpi $P/app/src/main/res/mipmap-anydpi-v26 $P/app/src/main/res/mipmap-xxxhdpi

          # Your files from the repo: offline backup copy of the app, and icons
          cp index.html sprites.js scene.js core.js brain.js ui.js boot.js $P/app/src/main/assets/
          cp app-icon.png $P/app/src/main/res/drawable-nodpi/pusheen_fg.png
          cp icon-512.png $P/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png

          cat > $P/settings.gradle.kts <<'EOF'
          pluginManagement {
              repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
              repositories { google(); mavenCentral() }
          }
          rootProject.name = "Pusheen"
          include(":app")
          EOF

          cat > $P/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application") version "8.5.2" apply false
          }
          EOF

          cat > $P/gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2g
          EOF

          cat > $P/app/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application")
          }
          android {
              namespace = "com.pusheen.app"
              compileSdk = 34
              defaultConfig {
                  applicationId = "com.t4rjpeg.pusheen"
                  minSdk = 26
                  targetSdk = 34
                  versionCode = 1
                  versionName = "1.0"
              }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
          }
          EOF

          cat > $P/app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <application
                  android:label="Pusheen"
                  android:icon="@mipmap/ic_launcher"
                  android:theme="@style/PusheenTheme">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:screenOrientation="portrait"
                      android:windowSoftInputMode="adjustResize"
                      android:configChanges="orientation|screenSize|uiMode|keyboardHidden">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat > $P/app/src/main/java/com/pusheen/app/MainActivity.java <<'EOF'
          package com.pusheen.app;

          import android.app.Activity;
          import android.graphics.Color;
          import android.os.Bundle;
          import android.view.View;
          import android.webkit.WebResourceError;
          import android.webkit.WebResourceRequest;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;

          public class MainActivity extends Activity {
              private WebView web;
              private static final String SITE = "https://t4rjpeg.github.io/PUSHEEN/";
              private static final String BACKUP = "file:///android_asset/index.html";

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  web = new WebView(this);
                  web.setBackgroundColor(Color.rgb(196, 229, 245));
                  WebSettings s = web.getSettings();
                  s.setJavaScriptEnabled(true);
                  s.setDomStorageEnabled(true);
                  s.setCacheMode(WebSettings.LOAD_DEFAULT);
                  s.setMediaPlaybackRequiresUserGesture(false);   // her voice can play right away
                  s.setAllowFileAccess(true);
                  // Long presses do nothing (no text menu, no vibration)
                  web.setLongClickable(false);
                  web.setOnLongClickListener(v -> true);
                  web.setHapticFeedbackEnabled(false);
                  web.setVerticalScrollBarEnabled(false);
                  web.setHorizontalScrollBarEnabled(false);
                  web.setOverScrollMode(View.OVER_SCROLL_NEVER);
                  web.setWebViewClient(new WebViewClient() {
                      @Override
                      public void onReceivedError(WebView view, WebResourceRequest req, WebResourceError err) {
                          // No internet and nothing saved yet: show the copy built into the app
                          if (req.isForMainFrame() && !BACKUP.equals(view.getUrl())) {
                              view.loadUrl(BACKUP);
                          }
                      }
                  });
                  setContentView(web);
                  web.loadUrl(SITE);
              }

              @Override
              public void onBackPressed() {
                  // Back closes an open panel first; it only leaves the app when nothing is open
                  web.evaluateJavascript("(window.pusheenBack && pusheenBack()) ? 'yes' : 'no'", v -> {
                      if (v == null || !v.contains("yes")) finish();
                  });
              }

              @Override
              protected void onPause() {
                  super.onPause();
                  if (web != null) web.onPause();
              }

              @Override
              protected void onResume() {
                  super.onResume();
                  if (web != null) web.onResume();
              }
          }
          EOF

          cat > $P/app/src/main/res/values/themes.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="PusheenTheme" parent="android:Theme.Material.Light.NoActionBar">
                  <item name="android:windowBackground">#C4E5F5</item>
                  <item name="android:statusBarColor">#C4E5F5</item>
                  <item name="android:navigationBarColor">#FFFAF0</item>
                  <item name="android:windowLightStatusBar">true</item>
              </style>
              <color name="pusheen_bg">#C4E5F5</color>
          </resources>
          EOF

          cat > $P/app/src/main/res/values-v27/themes.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="PusheenTheme" parent="android:Theme.Material.Light.NoActionBar">
                  <item name="android:windowBackground">#C4E5F5</item>
                  <item name="android:statusBarColor">#C4E5F5</item>
                  <item name="android:navigationBarColor">#FFFAF0</item>
                  <item name="android:windowLightStatusBar">true</item>
                  <item name="android:windowLightNavigationBar">true</item>
              </style>
          </resources>
          EOF

          cat > $P/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@color/pusheen_bg" />
              <foreground android:drawable="@drawable/pusheen_fg" />
          </adaptive-icon>
          EOF

      - name: Build APK
        working-directory: android
        run: gradle :app:assembleDebug --no-daemon

      - name: Publish APK
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk Pusheen.apk
          gh release create "apk-${{ github.run_number }}" Pusheen.apk \
            --title "Pusheen app (build ${{ github.run_number }})" \
            --notes "Download Pusheen.apk, open it from Files, and install. For an update, uninstall the old Pusheen first."
            
