      - name: Build APK
        working-directory: android
        run: gradle :app:assembleDebug --no-daemon

      - name: Publish APK
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk Pusheen.apk
          gh release create "apk-${{ github.run_number }}" Pusheen.apk \
            --title "Pusheen app (build ${{ github.run_number }})" \
            --notes "Download Pusheen.apk, open it from Files, and install. For an update, uninstall the old Pusheen first."
            
